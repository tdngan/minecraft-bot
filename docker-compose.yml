services:
  mc:
    image: itzg/minecraft-server:java25
    container_name: minecraft
    restart: unless-stopped
    tty: true
    stdin_open: true
    env_file:
      - .env
    ports:
      - "25565:25565"
    environment:
      EULA: "TRUE"
      TYPE: "PAPER"
      VERSION: "26.3"
      SEED: "3010093401612243309"
      TZ: "Asia/Ho_Chi_Minh"
      ENABLE_RCON: "true"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      RCON_PORT: "25575"

      # RAM: heap 4G, container giới hạn 5G (chừa chỗ cho metaspace/native)
      MEMORY: "4G"
      USE_AIKAR_FLAGS: "true"

      # Gameplay
      MODE: "survival"
      DIFFICULTY: "easy"
      MAX_PLAYERS: "20"
      MOTD: "ez"
      PVP: "true"
      SPAWN_PROTECTION: "0"

      # Tối ưu hiệu năng cho 10 người
      VIEW_DISTANCE: "12"
      SIMULATION_DISTANCE: "10"
      NETWORK_COMPRESSION_THRESHOLD: "256"
      SYNC_CHUNK_WRITES: "false"
      MAX_TICK_TIME: "-1"

      # Whitelist (26.3 bật mặc định). Đổi tên người chơi của bạn vào đây
      ENABLE_WHITELIST: "false"
      #WHITELIST: "TenNguoiChoi1,TenNguoiChoi2"
      #OPS: "TenAdmin"

      # Bảo mật: online-mode giữ true để xác thực tài khoản
      ONLINE_MODE: "false"
    volumes:
      - /home/ttdt/minecraft/data:/data
    mem_limit: 5g
    healthcheck:
      test: ["CMD", "mc-health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 10m
      
  discord-bot:
    image: ghcr.io/tdngan/mc-discord-bot:latest
    container_name: mc-discord-bot
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      mc:
        condition: service_healthy
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN}"
      RCON_HOST: "mc"
      RCON_PORT: "25575"
      RCON_PASSWORD: "${RCON_PASSWORD}"
      ALLOWED_USER_IDS: "${ALLOWED_USER_IDS}"
      GUILD_ID: "${GUILD_ID}"
      BLOCKED_COMMANDS: "${BLOCKED_COMMANDS}"
      
    